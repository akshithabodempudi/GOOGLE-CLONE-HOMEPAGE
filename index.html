<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Clone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top Navigation -->
    <header>
        <nav class="top-nav">
            <div class="left-links">
                <a href="#">About</a>
                <a href="#">Store</a>
            </div>

            <div class="right-links">
                <a href="#">Gmail</a>
                <a href="#">Images</a>
                <span class="apps">⋮⋮⋮</span>
                <div class="profile">A</div>
            </div>
        </nav>
    </header>


    <!-- Main Google Section -->
    <main>

        <!-- Google Logo -->
        <div class="google-logo">
            <span class="blue">G</span>
            <span class="red">o</span>
            <span class="yellow">o</span>
            <span class="blue">g</span>
            <span class="green">l</span>
            <span class="red">e</span>
        </div>

        <!-- Search Bar -->
        <div class="search-box">

            <span class="search-icon">⌕</span>

            <input type="text">

            <span class="mic">🎙️</span>
            <span class="camera">📷</span>

        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>
        </div>

        <!-- Language Section -->
        <div class="languages">
            <span>Google offered in:</span>
            <a href="#">हिन्दी</a>
            <a href="#">বাংলা</a>
            <a href="#">తెలుగు</a>
            <a href="#">मराठी</a>
            <a href="#">தமிழ்</a>
            <a href="#">ગુજરાતી</a>
        </div>

    </main>


    <!-- Footer -->
    <footer>

        <div class="country">
            India
        </div>

        <div class="footer-links">

            <div>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>

            <div>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>

        </div>

    </footer>

</body>
</html>
